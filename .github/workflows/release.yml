name: Bundled release

# Builds the combined NineSync extension from the commits pinned by this repository's submodules, validates it in
# official Blender, then (only after validation passes) creates a DRAFT GitHub release tagged v<bundle version>.
#
# Triggers:
#  - push to main that changes a submodule pin or the Bundled manifest (for example merging the component-update
#    PR, which also raises the Bundled version).
#  - manual dispatch.
# Both do the same: build, validate, create the DRAFT release, and (after the `extension-repository` approval) add
# the exact validated ZIP to the GitHub Pages extension repository.
# Nothing goes live without a person: the draft needs publishing by hand, and the `release` and
# `extension-repository` environments need approval. A push whose version was not raised fails at the tag check.
on:
  push:
    branches: [main]
    paths:
      - nine-sync-core
      - nine-sync-fx
      - packaging/bundle/blender_manifest.toml
  workflow_dispatch:
    inputs:
      blender_version:
        description: "Official Blender release to validate with (must be 5.3.0 or newer and exist on download.blender.org)"
        type: string
        default: "5.3.0"
      create_draft_release:
        description: "Create a DRAFT release v<bundle version> with the artifacts"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bundled-release
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: Build and statically validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Release tag is v<bundle version> and is new
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event_name == 'push' || inputs.create_draft_release }}
        run: |
          tag="v$(python -c "import tomllib; print(tomllib.load(open('packaging/bundle/blender_manifest.toml','rb'))['version'])")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag" >> "$GITHUB_STEP_SUMMARY"
          # A published release or an existing tag is never replaced; an unpublished draft is (see the draft job).
          # (This token may not see drafts, which is fine: the draft job re-checks with write access.)
          if [ "$DRAFT" = "true" ] && { [ "$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)" = "false" ] || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; }; then
            echo "tag or published release $tag already exists; raise the Bundled version first" >&2; exit 1
          fi
      - name: Show pinned sources
        run: git submodule status
      - name: Build
        run: python -I packaging/build_bundle.py --out dist --staging build/staging --cache build/downloads
      - name: Static validation
        run: python -I packaging/validate_bundle.py dist/nine-sync-*-blender-extensions.zip --report dist/static-validation.json
      - name: Checksum
        run: cd dist && sha256sum -c nine-sync-*-blender-extensions.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundled-extension
          path: dist/
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Validate in Blender
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundled-extension
          path: dist
      - name: Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1
      - name: Fetch Blender
        id: blender
        env:
          BLENDER_VERSION: ${{ inputs.blender_version || '5.3.0' }}
        run: |
          exe=$(python -I packaging/fetch_blender.py --version "$BLENDER_VERSION" --dest build/blender)
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "official=$(cat build/blender/official.txt)" >> "$GITHUB_OUTPUT"
      - name: Validate the ZIP in an isolated profile
        env:
          BLENDER_EXE: ${{ steps.blender.outputs.exe }}
          OFFICIAL: ${{ steps.blender.outputs.official }}
        run: |
          flag=""
          [ "$OFFICIAL" = "true" ] && flag="--official"
          python -I packaging/validate_in_blender.py --blender "$BLENDER_EXE" \
            --zip dist/nine-sync-*-blender-extensions.zip --report dist/blender-validation.json $flag
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: blender-validation
          path: dist/blender-validation.json
          if-no-files-found: warn
          retention-days: 30

  draft-release:
    name: Create draft release
    needs: [build, validate]
    if: ${{ (github.event_name == 'push' || inputs.create_draft_release) && needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release # configure required reviewers on this environment for a manual approval step
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundled-extension
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blender-validation
          path: dist
      - name: Publication gates
        run: python -I packaging/check_publish_gates.py --dist dist --validation dist/blender-validation.json --static dist/static-validation.json
      - name: Draft release notes (Core, FX and Bundled changes since the previous published release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: python -I packaging/release_notes.py draft --artifact-manifest dist/artifact-manifest.json --version "$TAG" --out dist/release-notes.md
      - name: Create the draft release (replaces an unpublished draft, never a published release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists; refusing to touch it" >&2; exit 1
          fi
          if state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            [ "$state" = "true" ] || { echo "release $TAG is published; refusing to touch it" >&2; exit 1; }
            echo "replacing the existing unpublished draft $TAG"
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "NineSync $TAG" \
            --notes-file dist/release-notes.md \
            dist/nine-sync-*-blender-extensions.zip \
            dist/artifact-manifest.json dist/blender-validation.json

  # --- Self-hosted Blender extension repository (GitHub Pages) -------------------------------------------------
  # Adds the exact ZIP that passed every gate above to the repository served at the Pages URL, so Blender can
  # install and update NineSync natively. Same gates as the draft release, plus a person must approve
  # the `extension-repository` environment. Experimental builds never reach this workflow.
  assemble-repository:
    name: Assemble extension repository
    needs: [build, validate]
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: extension-repository # configure required reviewers on this environment for a manual approval step
    outputs:
      base_url: ${{ steps.url.outputs.base_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundled-extension
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blender-validation
          path: dist
      - name: Publication gates
        run: python -I packaging/check_publish_gates.py --dist dist --validation dist/blender-validation.json --static dist/static-validation.json
      - name: Repository URL
        id: url
        env:
          OVERRIDE: ${{ vars.EXTENSION_REPO_URL }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Default project-page URL; set the EXTENSION_REPO_URL repository variable for a custom domain.
          url="${OVERRIDE:-https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io/$REPO/}"
          echo "base_url=$url" >> "$GITHUB_OUTPUT"
          echo "Extension repository: ${url}index.json"
      - name: Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1
      - name: Fetch official Blender
        id: blender
        env:
          BLENDER_VERSION: ${{ inputs.blender_version || '5.3.0' }}
        run: |
          exe=$(python -I packaging/fetch_blender.py --version "$BLENDER_VERSION" --dest build/blender)
          [ "$(cat build/blender/official.txt)" = "true" ] || { echo "official Blender required" >&2; exit 1; }
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
      - name: Generate the repository with Blender's server-generate
        env:
          BASE_URL: ${{ steps.url.outputs.base_url }}
          BLENDER_EXE: ${{ steps.blender.outputs.exe }}
        run: |
          python -I packaging/extension_repo.py assemble --zip dist/nine-sync-*-blender-extensions.zip \
            --artifact-manifest dist/artifact-manifest.json --base-url "$BASE_URL" --blender "$BLENDER_EXE" --out site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy-repository:
    name: Deploy to GitHub Pages
    needs: assemble-repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ needs.assemble-repository.outputs.base_url }}index.json
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-repository:
    name: Verify the public repository
    needs: [build, assemble-repository, deploy-repository]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundled-extension
          path: dist
      - name: index.json and ZIP are served and match the release ZIP
        env:
          BASE_URL: ${{ needs.assemble-repository.outputs.base_url }}
        run: python -I packaging/extension_repo.py verify --zip dist/nine-sync-*-blender-extensions.zip --base-url "$BASE_URL"
