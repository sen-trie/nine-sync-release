<svg xmlns="http://www.w3.org/2000/svg" font-family="Nunito, Arial, sans-serif" viewBox="0 0 920 580" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">NineSync architecture</title>
<desc id="arch-desc">Core reads the PMM and sends motion to the mmd_tools VMD importer. The PMX importer supplies the model. Both importers and Core write to the Blender scene. After sync, Core passes the retimed project through the hook registry to FX, which reads accessories and compiles their effects into Blender nodes.</desc>
