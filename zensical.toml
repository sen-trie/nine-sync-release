[project]
site_name = "NineSync Documentation"
site_description = "Guides and manuals for NineSync, the MMD-to-Blender extension"
site_url = "https://ninesync-docs.sentrie.workers.dev/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/sen-trie/nine-sync-release"
repo_name = "nine-sync-release"
edit_uri = "edit/main/docs/"
extra_css = ["assets/extra.css"]
extra_javascript = ["assets/changelog.js", "assets/pagenav.js"]

# Navigation: "Manual" holds the features, each indented under it; a feature's own pages and its "How ... Works" group are
# indented under the feature. navigation.expand keeps those levels open so every page is visible without clicking.
nav = [
  { "Introduction" = [
    "index.md",
    "installation.md",
    "changelog.md",
    "motivation.md",
    "disclaimer.md",
  ] },
  { "Manual" = [
    "manual/index.md",
    "manual/core/pmm-create.md",
    { "PMM Sync" = [
      "manual/core/pmm-sync/index.md",
      "manual/core/pmm-sync/how-it-works/index.md",
      "manual/core/pmm-sync/how-it-works/reading-and-writing.md",
      "manual/core/pmm-sync/how-it-works/synchronization.md",
      "manual/core/pmm-sync/how-it-works/fx-integration.md",
    ] },
    { "Rigify Remap" = [
      "manual/core/rigify-remap/index.md",
      "manual/core/rigify-remap/how-it-works.md",
    ] },
    { "FX Import" = [
      "manual/fx/index.md",
      "manual/fx/import.md",
      "manual/fx/geometry-nodes.md",
      "manual/fx/shader-nodes.md",
      { "How FX Works" = [
        "manual/fx/how-it-works/index.md",
        "manual/fx/how-it-works/geometry-nodes-translation.md",
        "manual/fx/how-it-works/shader-translation.md",
        "manual/fx/how-it-works/culling.md",
        "manual/fx/how-it-works/cache.md",
        "manual/fx/how-it-works/shared-library.md",
      ] },
    ] },
  ] },
  { "Common Issues" = "issues.md" },
  "faq.md",
  "triage.md",
  "contributors.md",
  "credits.md",
]

[project.theme]
variant = "modern"
features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.expand",
  "navigation.footer",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
]
font.text = "Nunito"

[[project.theme.palette]]
scheme = "slate"
primary = "light blue"
accent = "cyan"
