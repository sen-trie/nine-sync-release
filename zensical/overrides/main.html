{% extends "base.html" %}

{% block extrahead %}
  {% set og_image = config.site_url ~ "assets/logo-single.png" %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ page.title ~ ' - ' ~ config.site_name if page and page.title and not page.is_homepage else config.site_name }}">
  <meta property="og:description" content="{{ page.meta.description if page and page.meta and page.meta.description else config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta property="og:image:width" content="900">
  <meta property="og:image:height" content="900">
  <meta name="theme-color" content="#5AA9F0">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="{{ og_image }}">
  {{ super() }}
{% endblock %}
